name: Release

# Run by hand from the Actions tab, on main only. It tests the code, publishes the Docker image for linux/amd64 and
# linux/arm64 (a Raspberry Pi) to ghcr.io, tags the commit and makes a GitHub release with install/get.sh attached as
# install.sh. That file is the one-line install: it needs no download of the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two runs on the same day never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute the version
        id: version
        # YYYY.M.D in UTC, plus .N when a release was already made today (see scripts/release-version.sh).
        run: echo "version=$(bash scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    # The whole suite on the commit being released. A red test stops the release before anything is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
      - name: Lint
        run: python -m pip install "ruff==0.16.9" && ruff check .
      - name: Run both services against a fake meter
        run: sh tests/e2e/run.sh

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        # ghcr.io wants the owner in lower case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homewizard-p1" >> "$GITHUB_ENV"
      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  release:
    # Tags the commit the image was built from, then attaches the install script to the release of that tag.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag
        # Through the API, not git push: GitHub refuses a pushed tag on a commit that changes .github/workflows/ unless the
        # token has the workflows permission. A tag already on this commit (a rerun) is kept. One on another commit stops.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "The tag v$VERSION already exists on another commit ($existing)." >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Attach the install script to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          sed "s/^RELEASE=\"\"$/RELEASE=\"v$VERSION\"/" install/get.sh > release/install.sh
          grep -qx "RELEASE=\"v$VERSION\"" release/install.sh || { echo "install/get.sh has no RELEASE=\"\" line to fill in." >&2; exit 1; }
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" release/install.sh --clobber
